<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva tu Viaje | RUTAS DEL SOL PERU SAC</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/estilos2.css">

  <style>
    body { background-color: #f9f9f9; font-family: 'Arial', sans-serif; }

    /* Navbar */
    nav.navbar { background-color: #343a40; }
    nav.navbar a.nav-link { color: #fff; }
    nav.navbar a.nav-link:hover, nav.navbar a.active { color: #ffc107; }

    /* Header */
    header { background-color: #0d6efd; color: #fff; padding: 3rem 1rem; text-align: center; }
    header a { color: #fff; text-decoration: underline; display: inline-block; margin-top: 1rem; }

    /* Formulario */
    .reserva-card {
      max-width: 700px;
      margin: -3rem auto 3rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .reserva-card h2 { margin-bottom: 1.5rem; }
    .form-control, .form-select { border-radius: 8px; }
    .btn-primary { width: 100%; border-radius: 8px; }
    .exito { display: none; color: green; margin-top: 10px; font-weight: 500; text-align: center; }

    /* Footer */
    footer { background-color: #343a40; color: #fff; text-align: center; padding: 2rem 1rem; margin-top: 3rem; }

    @media (max-width: 576px) {
      .reserva-card { margin: 2rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-sun"></i> Rutas del Sol Perú</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="quienes-somos.html"><i class="fas fa-users"></i> Quienes Somos</a></li>
          <li class="nav-item"><a class="nav-link" href="servicios.html"><i class="fas fa-concierge-bell"></i> Servicios</a></li>
          <li class="nav-item"><a class="nav-link active" href="viaje.html"><i class="fas fa-plane-departure"></i> Reservas</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html"><i class="fas fa-envelope"></i> Contáctanos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header>
    <h1>Reserva tu Viaje</h1>
    <a href="viaje.html" aria-label="Volver a la página anterior">← Volver a Destinos</a>
  </header>

  <!-- Formulario de reserva -->
  <main class="reserva-card scroll-reveal">
    <h2 id="destino-titulo">Destino</h2>
    <form id="form-reserva" novalidate>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo *</label>
        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Janeth Yance" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" class="form-control" pattern="^[0-9]{9}$" maxlength="9" placeholder="Ej. 987654321">
      </div>

      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de viaje *</label>
        <input type="date" id="fecha" name="fecha" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="personas" class="form-label">N° de personas *</label>
        <input type="number" id="personas" name="personas" class="form-control" min="1" max="100" required>
      </div>

      <div class="mb-3">
        <label for="comentarios" class="form-label">Comentarios</label>
        <textarea id="comentarios" name="comentarios" rows="4" class="form-control" placeholder="¿Algún requerimiento especial?"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Enviar Reserva</button>
      <p id="mensaje-exito" class="exito">¡Reserva enviada con éxito!</p>
    </form>
  </main>

  <!-- Footer -->
  <footer class="scroll-reveal">
    <p class="mb-1">&copy; 2025 RUTAS DEL SOL PERU SAC — Todos los derechos reservados</p>
    <p class="mb-0"><i class="fas fa-phone-alt"></i> (+51) 999 888 777 | <i class="fas fa-envelope"></i> contacto@rutasdelsol.pe</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fecha mínima para el input
    document.addEventListener("DOMContentLoaded", () => {
      const fechaInput = document.getElementById("fecha");
      const hoy = new Date();
      const manana = new Date(hoy);
      manana.setDate(hoy.getDate() + 1);

      const yyyy = manana.getFullYear();
      const mm = String(manana.getMonth() + 1).padStart(2, '0');
      const dd = String(manana.getDate()).padStart(2, '0');
      fechaInput.min = `${yyyy}-${mm}-${dd}`;

      // Enviar formulario
      const form = document.getElementById("form-reserva");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }

        const datos = {
          destino: document.getElementById("destino-titulo").innerText,
          nombre: document.getElementById("nombre").value,
          email: document.getElementById("email").value,
          telefono: document.getElementById("telefono").value,
          fecha: document.getElementById("fecha").value,
          personas: document.getElementById("personas").value,
          comentarios: document.getElementById("comentarios").value
        };

        const respuesta = await fetch("http://localhost:3000/enviar-reserva", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();
        if (resultado.mensaje) {
          document.getElementById("mensaje-exito").style.display = "block";
          form.reset();
        }
      });
    });

    // Scroll reveal
    const toReveal = document.querySelectorAll('.scroll-reveal');
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => e.isIntersecting && e.target.classList.add('visible')),
      { threshold: 0.2 }
    );
    toReveal.forEach(el => obs.observe(el));
  </script>
</body>
</html>
